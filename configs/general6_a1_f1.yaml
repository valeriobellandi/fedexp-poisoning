# Third round, six clients: one malicious coastal client against two honest ones.
world:
  n_codes: 40
  n_procedures: 8
  overrides_per_site: 6
clients:
  site_types: [coastal, coastal, mountain, mountain, urban, coastal]
  coverage: 0.4
  records_per_code: 2
  upload_scope: general      # clients share their rules as rules for all sites
server:
  aggregator: per_code
  show_client_site: true     # the server sees the site type of each client
attack:
  kind: a1
  malicious: [1]
  n_targets: 10
  claim_scope: global        # same wording as the honest clients
llm:
  backend: hf
  model_id: Qwen/Qwen2.5-7B-Instruct
  batch_size: 8
  load_in_4bit: false
