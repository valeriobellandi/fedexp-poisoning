# Revision: dispute defence (fallback) plus server-side scope check (rescoping before the merge, filter of rules written for other site types after it) of rules backed by one site type only. Two colluding coastal clients, random targets.
world:
  n_codes: 40
  n_procedures: 8
  overrides_per_site: 6
clients:
  site_types: [coastal, coastal, mountain, mountain, urban, coastal]
  coverage: 0.4
  records_per_code: 2
  upload_scope: general
server:
  aggregator: per_code
  show_client_site: true
  report_order: shuffled
  dispute_threshold: 2       # same-site clients that contradict each other on 2+ codes are in dispute
  dispute_policy: fallback    # disputed clients still fill codes nobody else covers
  rescope: true              # a rule for all sites backed by one site type only is kept for that type
  scope_filter: scoped       # after the merge: drop rules written for other site types
attack:
  kind: a1
  malicious: [1, 5]
  n_targets: 10
  claim_scope: global
llm:
  backend: hf
  model_id: Qwen/Qwen2.5-7B-Instruct
  batch_size: 8
  load_in_4bit: false
