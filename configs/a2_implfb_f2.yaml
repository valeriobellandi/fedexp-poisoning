# Ninth round, A2 (trigger-conditioned): world with a legitimate condition. Dispute defence comparing the procedures implied under the condition.
world:
  n_codes: 40
  n_procedures: 8
  overrides_per_site: 6
  condition: during a storm      # one condition, legitimate for a few codes
  n_conditional: 6
clients:
  site_types: [coastal, coastal, mountain, mountain, urban, coastal]
  coverage: 0.4
  records_per_code: 2
  upload_scope: general
server:
  aggregator: per_code
  show_client_site: true
  report_order: shuffled
  dispute_threshold: 2
  dispute_policy: fallback
  dispute_conditions: implied
attack:
  kind: a2
  malicious: [1, 5]
  n_targets: 10
llm:
  backend: hf
  model_id: Qwen/Qwen2.5-7B-Instruct
  batch_size: 8
  load_in_4bit: false
