  show_client_site: true
  report_order: shuffled
  dispute_threshold: 2
  dispute_policy: fallback
attack:
  kind: none
llm:
  backend: hf
  model_id: Qwen/Qwen2.5-7B-Instruct
  batch_size: 8
  load_in_4bit: false
