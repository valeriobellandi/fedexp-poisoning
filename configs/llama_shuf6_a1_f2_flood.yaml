# Second model (Llama 3.1 8B), same setting as shuf6_a1_f2_flood. Sixth round, adaptive attackers: two colluding clients send a false rule for every code. No defence.
world:
  n_codes: 40
  n_procedures: 8
  overrides_per_site: 6
clients:
  site_types: [coastal, coastal, mountain, mountain, urban, coastal]
  coverage: 0.4
  records_per_code: 2
  upload_scope: general
server:
  aggregator: per_code
  show_client_site: true
  report_order: shuffled
attack:
  kind: a1
  malicious: [1, 5]
  n_targets: 40
  claim_scope: global
llm:
  backend: hf
  model_id: meta-llama/Llama-3.1-8B-Instruct
  batch_size: 8
  load_in_4bit: false
