# Second model (Llama 3.1 8B), same setting as shuf6_q2_a1_f2. Fourth round: six clients, shuffled report order, support threshold 2. Two colluding clients.
world:
  n_codes: 40
  n_procedures: 8
  overrides_per_site: 6
clients:
  site_types: [coastal, coastal, mountain, mountain, urban, coastal]
  coverage: 0.4
  records_per_code: 2
  upload_scope: general
server:
  aggregator: per_code
  show_client_site: true
  report_order: shuffled     # reports about a code are shown in random order
  min_support: 2             # a rule needs 2 clients behind it (same site type for site rules)
attack:
  kind: a1
  malicious: [1, 5]
  n_targets: 10
  claim_scope: global
llm:
  backend: hf
  model_id: meta-llama/Llama-3.1-8B-Instruct
  batch_size: 8
  load_in_4bit: false
