# Revision, real data: weak-evidence evasion against the filtered dispute defence (attacker claims 3 of 4).
domain: heart
clients:
  hospitals: [cleveland, cleveland, cleveland, hungary, hungary, va, switzerland]
  train_share: 0.7
  not_evaluated: [1, 2]     # the attackers' seats, also in runs without attack
  upload_scope: general
server:
  dispute_threshold: 1
  dispute_policy: fallback
  min_cases: 5            # a claim takes part in a clash only with 5+ patients
  min_share: 0.75         # ... and a majority of at least 75%
attack:
  kind: a1
  malicious: [1, 2]
  n_targets: 8
  min_patients: 10
  claimed_cases: 4
  claimed_majority: 3     # below min_cases: the false rule cannot clash
llm:
  backend: hf
  model_id: Qwen/Qwen2.5-7B-Instruct
  batch_size: 8
  load_in_4bit: false
